<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scribouille</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Bibliotheque d'icones, reutilisees par reference. -->
<svg style="display:none" aria-hidden="true">
  <symbol id="i-onde" viewBox="0 0 24 24"><path d="M2 12h2M7 6v12M12 3v18M17 7v10M22 12h-2"/></symbol>
  <symbol id="i-cadenas" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-puce" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></symbol>
  <symbol id="i-depot" viewBox="0 0 24 24"><path d="M12 16V4M12 4 7.5 8.5M12 4l4.5 4.5"/><path d="M4 16v2.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V16"/></symbol>
  <symbol id="i-fichier" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-croix" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-coche" viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></symbol>
  <symbol id="i-alerte" viewBox="0 0 24 24"><path d="M12 3.5 1.8 20.5h20.4z"/><path d="M12 10v4.5M12 17.6v.1"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.1"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-haut" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
  <symbol id="i-retour" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-dossier" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-lecture" viewBox="0 0 24 24"><path d="M6 4.5v15L19.5 12z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
  <symbol id="i-recul" viewBox="0 0 24 24"><path d="M11 7 6 12l5 5M18 7l-5 5 5 5"/></symbol>
  <symbol id="i-avance" viewBox="0 0 24 24"><path d="m13 7 5 5-5 5M6 7l5 5-5 5"/></symbol>
  <symbol id="i-arret" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-livre" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-personnes" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20v-1.5A4.5 4.5 0 0 1 7.5 14h3A4.5 4.5 0 0 1 15 18.5V20"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.9M17.5 14h.5a3.5 3.5 0 0 1 3.5 3.5V20"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></symbol>
  <symbol id="i-aide" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.4 9.3a2.7 2.7 0 0 1 5.2.9c0 1.8-2.6 2.3-2.6 4M12 17.2v.1"/></symbol>
  <symbol id="i-reglages" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></symbol>
  <symbol id="i-horloge" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 2"/></symbol>
  <symbol id="i-corbeille" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7"/></symbol>
  <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3v12M12 3 8 7M12 3l4 4"/><path d="M4 15v3.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V15"/></symbol>
  <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 15V3M12 15l-4-4M12 15l4-4"/><path d="M4 15v3.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V15"/></symbol>
  <symbol id="i-externe" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8.5 8.5"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
  <symbol id="i-loupe" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-copie" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="12" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></symbol>
  <symbol id="i-etincelle" viewBox="0 0 24 24"><path d="M12 3.5 13.9 9 19.5 11 13.9 13 12 18.5 10.1 13 4.5 11 10.1 9z"/><path d="M18.5 16.5 19.2 18.3 21 19l-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></symbol>
  <symbol id="i-crayon" viewBox="0 0 24 24"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 6.5l3 3"/></symbol>
  <symbol id="i-reprise" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5V10h5.5"/></symbol>
  <symbol id="i-langue" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.2 9.5h17.6M3.2 14.5h17.6"/><path d="M12 3c2.4 2.6 3.6 5.6 3.6 9s-1.2 6.4-3.6 9c-2.4-2.6-3.6-5.6-3.6-9S9.6 5.6 12 3z"/></symbol>
  <symbol id="i-disque" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
</svg>

<header class="entete">
  <div class="marque">
    <svg class="icone-l icone"><use href="#i-onde"></use></svg>
    <span class="nom-appli">Scribouille</span>
    <span class="version" id="version"></span>
  </div>
  <span class="confidentialite" data-i18n-title="ui.entete.local_titre">
    <svg class="icone-s icone"><use href="#i-cadenas"></use></svg>
    <span data-i18n="ui.entete.local"></span>
  </span>
  <span class="veille" id="indic-surveillance" style="display:none" title="">
    <svg class="icone-s icone"><use href="#i-dossier"></use></svg>
    <span id="indic-surveillance-texte"></span>
  </span>
  <!-- Transcription en cours, vue depuis un autre ecran : un clic y ramene. -->
  <button class="activite" id="indic-activite" hidden>
    <span class="point"></span><span id="indic-activite-texte"></span>
  </button>
  <span class="pousse"></span>
  <nav class="navigation" data-i18n-aria="ui.nav.titre">
    <button class="bouton bouton-nav" id="btn-nav-vocabulaire" data-vue="vocabulaire" data-i18n-aria="ui.nav.vocabulaire">
      <svg class="icone-s icone"><use href="#i-livre"></use></svg>
      <span data-i18n="ui.nav.vocabulaire"></span>
      <span class="voc-compteur" id="voc-compteur-propositions" hidden></span>
    </button>
    <button class="bouton bouton-nav" id="btn-nav-reglages" data-vue="reglages" data-i18n-aria="ui.nav.reglages">
      <svg class="icone-s icone"><use href="#i-reglages"></use></svg>
      <span data-i18n="ui.nav.reglages"></span>
    </button>
  </nav>
  <button class="bouton-icone" id="btn-theme"
          data-i18n-title="ui.entete.theme" data-i18n-aria="ui.entete.theme">
    <svg class="icone"><use href="#i-theme"></use></svg>
  </button>
  <button class="bouton-icone" id="btn-aide"
          data-i18n-title="ui.entete.aide" data-i18n-aria="ui.entete.aide">
    <svg class="icone"><use href="#i-aide"></use></svg>
  </button>
</header>

<!-- Mise a jour disponible. Masque tant que rien n'a ete trouve, et rien n'est
     cherche tant que l'utilisateur n'a pas active la verification. -->
<div class="bandeau-maj" id="bandeau-maj" style="display:none">
  <svg class="icone-s icone"><use href="#i-info"></use></svg>
  <span id="bandeau-maj-texte"></span>
  <span class="pousse"></span>
  <button class="bouton" id="btn-maj-page">
    <svg class="icone-s icone"><use href="#i-externe"></use></svg>
    <span data-i18n="ui.maj.voir"></span>
  </button>
  <button class="bouton-icone" id="btn-maj-fermer"
          data-i18n-title="ui.maj.masquer" data-i18n-aria="ui.maj.masquer">
    <svg class="icone"><use href="#i-croix"></use></svg>
  </button>
</div>

<!-- ======================== Ecran principal : les reunions ================== -->
<main class="vue vue-principale" id="vue-principale" data-vue="principale">
  <div class="colonne-centre">

    <!-- Les seuls choix utiles a chaque lancement. Le reste est dans Reglages. -->
    <section class="carte lancement" id="bloc-lancement" aria-labelledby="titre-lancement">
      <h1 class="masque" id="titre-lancement" data-i18n="ui.lance.titre"></h1>
      <div class="lancement-choix">
        <div class="choix">
          <span class="choix-libelle" id="lbl-qualite" data-i18n="ui.lance.qualite"></span>
          <div class="segments" id="segments-qualite" role="radiogroup" aria-labelledby="lbl-qualite"></div>
        </div>
        <div class="choix">
          <span class="choix-libelle" id="lbl-rythme" data-i18n="ui.lance.rythme"></span>
          <div class="segments" id="segments-rythme" role="radiogroup" aria-labelledby="lbl-rythme">
            <button class="segment" role="radio" data-rythme="vitesse" aria-checked="true" data-i18n="ui.rythme.vitesse"></button>
            <button class="segment" role="radio" data-rythme="equilibre" aria-checked="false" data-i18n="ui.rythme.equilibre"></button>
            <button class="segment" role="radio" data-rythme="discret" aria-checked="false" data-i18n="ui.rythme.discret"></button>
          </div>
        </div>
        <div class="choix" id="choix-voix" hidden>
          <span class="choix-libelle" id="lbl-voix" data-i18n="ui.lance.voix"></span>
          <label class="bascule bascule-compacte">
            <input type="checkbox" id="opt-voix-lancement" aria-labelledby="lbl-voix">
            <span class="piste"></span>
            <span id="voix-lancement-etat"></span>
          </label>
        </div>
      </div>
      <p class="lancement-resume">
        <span id="lancement-duree"></span>
        <button class="bouton-lien" id="btn-tous-reglages" data-i18n="ui.lance.tous_reglages"></button>
      </p>
      <div id="lancement-avis"></div>
    </section>

    <div class="zone-depot" id="zone-depot" role="button" tabindex="0">
      <svg class="icone grande-icone"><use href="#i-depot"></use></svg>
      <div class="depot-textes">
        <div class="principal" data-i18n="ui.depot.principal"></div>
        <div class="secondaire" data-i18n="ui.depot.secondaire"></div>
      </div>
      <div class="formats" data-i18n="ui.depot.formats"></div>
    </div>

    <!-- Transcriptions interrompues, proposees a la reprise -->
    <div id="bloc-reprises"></div>

    <section class="carte section-liste" aria-labelledby="titre-file">
      <div class="section-entete">
        <h2 id="titre-file"><span data-i18n="ui.onglet.file"></span>
          <span class="compteur" id="compteur-file">0</span></h2>
        <span class="pousse"></span>
        <button class="bouton bouton-discret bouton-petit" id="btn-vider" hidden>
          <svg class="icone-s icone"><use href="#i-corbeille"></use></svg>
          <span data-i18n="ui.file.retirer_termines"></span>
        </button>
      </div>
      <div class="liste" id="vue-file"></div>
    </section>

    <section class="carte section-liste" aria-labelledby="titre-historique">
      <div class="section-entete">
        <h2 id="titre-historique"><span data-i18n="ui.onglet.historique"></span>
          <span class="compteur" id="compteur-historique">0</span></h2>
        <span class="pousse"></span>
        <input type="search" id="recherche-historique" class="recherche-courte" spellcheck="false"
               data-i18n-placeholder="ui.historique.filtrer" data-i18n-aria="ui.historique.filtrer">
        <button class="bouton bouton-discret bouton-petit" id="btn-ouvrir-sorties">
          <svg class="icone-s icone"><use href="#i-dossier"></use></svg>
          <span data-i18n="ui.historique.dossier"></span>
        </button>
      </div>
      <div class="liste historique" id="vue-historique"></div>
    </section>
  </div>
</main>

<!-- ============================== Relecture =============================== -->
<main class="vue vue-relecture" id="vue-relecture" data-vue="relecture" hidden aria-labelledby="rl-titre">
  <div class="rl-entete">
    <button class="bouton bouton-discret" id="rl-retour">
      <svg class="icone-s icone"><use href="#i-retour"></use></svg>
      <span data-i18n="ui.bouton.retour"></span>
    </button>
    <div class="rl-titres">
      <h1 id="rl-titre" tabindex="-1"></h1>
      <div class="rl-meta" id="rl-meta"></div>
    </div>
    <span class="pousse"></span>
    <button class="bouton bouton-discret" id="rl-annuler" hidden>
      <svg class="icone-s icone"><use href="#i-reprise"></use></svg>
      <span data-i18n="ui.rl.annuler"></span>
    </button>
    <div class="menu-conteneur">
      <button class="bouton" id="rl-exporter" aria-haspopup="menu" aria-expanded="false" aria-controls="rl-menu-export">
        <svg class="icone-s icone"><use href="#i-export"></use></svg>
        <span data-i18n="ui.rl.exporter"></span>
        <svg class="icone-s icone"><use href="#i-chevron"></use></svg>
      </button>
      <div class="menu" id="rl-menu-export" role="menu" hidden>
        <button role="menuitem" data-export="texte" data-i18n="ui.rl.export.texte"></button>
        <button role="menuitem" data-export="heures" data-i18n="ui.rl.export.heures"></button>
        <button role="menuitem" data-export="markdown" data-i18n="ui.rl.export.markdown"></button>
        <button role="menuitem" data-export="enregistrer_md" data-i18n="ui.rl.export.enregistrer_md"></button>
        <hr>
        <button role="menuitem" data-export="ouvrir" data-i18n="ui.rl.export.ouvrir"></button>
        <button role="menuitem" data-export="dossier" data-i18n="ui.rl.export.dossier"></button>
      </div>
    </div>
    <button class="bouton bouton-accent" id="btn-copier-ia">
      <svg class="icone-s icone"><use href="#i-etincelle"></use></svg>
      <span data-i18n="ui.lecture.copier_ia"></span>
    </button>
  </div>

  <div class="rl-outils" role="toolbar" data-i18n-aria="ui.rl.outils">
    <div class="rl-groupe rl-lecteur" id="rl-lecteur">
      <button class="bouton rl-lire" id="rl-lire" aria-pressed="false">
        <svg class="icone-s icone" id="rl-lire-icone"><use href="#i-lecture"></use></svg>
        <span id="rl-lire-texte" data-i18n="ui.rl.lire"></span>
      </button>
      <button class="bouton-icone" id="rl-reculer" data-i18n-title="ui.rl.reculer" data-i18n-aria="ui.rl.reculer">
        <svg class="icone-s icone"><use href="#i-recul"></use></svg>
      </button>
      <button class="bouton-icone" id="rl-avancer" data-i18n-title="ui.rl.avancer" data-i18n-aria="ui.rl.avancer">
        <svg class="icone-s icone"><use href="#i-avance"></use></svg>
      </button>
      <span class="rl-temps" id="rl-temps">0:00</span>
      <input type="range" id="rl-position" min="0" max="1" step="0.1" value="0" data-i18n-aria="ui.rl.position">
      <select id="rl-vitesse" data-i18n-aria="ui.rl.vitesse" data-i18n-title="ui.rl.vitesse">

      </select>
      <label class="case rl-suivre"><input type="checkbox" id="rl-suivre" checked><span data-i18n="ui.rl.suivre"></span></label>
    </div>
    <div class="rl-groupe rl-recherche" role="search">
      <svg class="icone-s icone rl-loupe"><use href="#i-loupe"></use></svg>
      <input type="search" id="rl-chercher" spellcheck="false"
             data-i18n-placeholder="ui.rl.chercher" data-i18n-aria="ui.rl.chercher_aria">
      <span class="rl-compte" id="rl-compte" aria-live="polite"></span>
      <button class="bouton-icone" id="rl-chercher-prec" data-i18n-title="ui.rl.precedent" data-i18n-aria="ui.rl.precedent">
        <svg class="icone-s icone"><use href="#i-haut"></use></svg>
      </button>
      <button class="bouton-icone" id="rl-chercher-suiv" data-i18n-title="ui.rl.suivant" data-i18n-aria="ui.rl.suivant">
        <svg class="icone-s icone"><use href="#i-chevron"></use></svg>
      </button>
    </div>
    <div class="rl-groupe rl-verifier">
      <select id="rl-categorie" data-i18n-aria="ui.rl.verifier"></select>
      <span class="rl-compte" id="rl-point" aria-live="polite"></span>
      <button class="bouton-icone" id="rl-point-prec" data-i18n-title="ui.rl.point_prec" data-i18n-aria="ui.rl.point_prec">
        <svg class="icone-s icone"><use href="#i-haut"></use></svg>
      </button>
      <button class="bouton-icone" id="rl-point-suiv" data-i18n-title="ui.rl.point_suiv" data-i18n-aria="ui.rl.point_suiv">
        <svg class="icone-s icone"><use href="#i-chevron"></use></svg>
      </button>
      <button class="bouton bouton-discret bouton-petit" id="rl-annuler-remplacement" hidden data-i18n="ui.rl.annuler_remplacement"></button>
    </div>
  </div>

  <div class="rl-avis" id="rl-avis"></div>
  <div class="rl-defilement" id="rl-defilement">
    <div class="rl-texte" id="rl-texte"></div>
  </div>
  <div class="rl-statut" id="rl-statut" role="status" aria-live="polite"></div>
  <audio id="rl-son" preload="metadata"></audio>
</main>

<!-- ============================== Reglages ================================ -->
<main class="vue vue-reglages" id="vue-reglages" data-vue="reglages" hidden aria-labelledby="titre-reglages">
  <div class="vue-entete">
    <button class="bouton bouton-discret" data-retour>
      <svg class="icone-s icone"><use href="#i-retour"></use></svg>
      <span data-i18n="ui.bouton.retour"></span>
    </button>
    <h1 id="titre-reglages" tabindex="-1" data-i18n="ui.nav.reglages"></h1>
  </div>
  <div class="reglages">
    <nav class="reglages-nav" role="tablist" aria-orientation="vertical" data-i18n-aria="ui.nav.reglages">
      <span class="nav-groupe" data-i18n="ui.reg.groupe.courant"></span>
      <button role="tab" data-section="transcription" data-i18n="ui.reg.transcription"></button>
      <button role="tab" data-section="fichiers" data-i18n="ui.reg.fichiers"></button>
      <button role="tab" data-section="relecture" data-i18n="ui.reg.relecture"></button>
      <button role="tab" data-section="application" data-i18n="ui.reg.application"></button>
      <span class="nav-groupe" data-i18n="ui.reg.groupe.avance"></span>
      <button role="tab" data-section="moteur" data-i18n="ui.reg.moteur"></button>
      <button role="tab" data-section="espace" data-i18n="ui.reg.espace"></button>
      <span class="nav-groupe" data-i18n="ui.reg.groupe.mesures"></span>
      <button role="tab" data-section="poste" data-i18n="ui.reg.poste"></button>
      <button role="tab" data-section="banc" data-i18n="ui.reg.banc"></button>
      <button role="tab" data-section="comparaison" data-i18n="ui.reg.comparaison"></button>
      <button role="tab" data-section="journal" data-i18n="ui.reg.journal"></button>
    </nav>

    <div class="reglages-contenu" id="reglages-contenu">

      <!-- ------------------------------------------------ Transcription -->
      <section class="reglages-section" role="tabpanel" data-section="transcription">
        <h2 data-i18n="ui.reg.transcription"></h2>

        <div class="bloc-reglage">
          <span class="titre-section" data-i18n="ui.section.qualite"></span>
          <div class="presets" id="presets"></div>
          <div id="avertissements"></div>
        </div>

        <div class="bloc-reglage" id="bloc-rythme">
          <span class="titre-section" data-i18n="ui.section.rythme"></span>
          <div class="rythmes" role="radiogroup" data-i18n-aria="ui.section.rythme">
