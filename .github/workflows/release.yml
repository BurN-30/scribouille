# Chaîne de publication de Scribouille.
#
# Deux déclenchements :
#   - un tag « vX.Y.Z » : construit, vérifie, et publie une Release avec le
#     programme d'installation, le paquet portable et leurs empreintes SHA-256 ;
#   - « Run workflow » depuis l'onglet Actions (seulement quand ce fichier est
#     sur la branche par défaut) : construit et vérifie tout, dépose les
#     fichiers en artefacts, mais ne publie rien.
#
# La construction elle-même est dans .github/actions/construire : la même que
# celle de l'essai de l'installateur (essai-installateur.yml), qui installe,
# met à jour et désinstalle pour de vrai le programme construit, sans tag.
#
# MARQUEUR [reinstallation-requise]
# ---------------------------------
# Les notes de version sont la section correspondante de CHANGELOG.md, et elles
# deviennent le corps (body) de la Release. L'application, quand l'utilisateur a
# activé la vérification des mises à jour, relit ce corps : s'il contient
#
#     [reinstallation-requise]
#
# le bandeau affiché dans l'application annonce qu'il faut désinstaller puis
# réinstaller, au lieu de proposer une installation par-dessus. Réservé aux
# versions qui ne peuvent vraiment pas se mettre à jour en place. Les données et
# les modèles vivent hors du dossier du programme et survivent de toute façon.
# Écrire le marqueur dans la section du CHANGELOG suffit à le propager.
name: Publication

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construire:
    name: Construire et publier
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Construire
        id: construire
        uses: ./.github/actions/construire

      - name: Préparer les notes de version
        shell: pwsh
        run: |
          # Les notes sont la section du CHANGELOG portant le numéro publié,
          # suivies des empreintes : une seule source, rien de recopié à la main.
          # Sur un tag, une section absente ou encore « non publiée » arrête tout.
          $publication = @()
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $publication = @('--publication') }
          python packaging/notes_version.py "${{ steps.construire.outputs.version }}" --empreintes packaging/sortie/SHA256SUMS.txt --sortie notes-version.md @publication
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Déposer les fichiers construits
        uses: actions/upload-artifact@v4
        with:
          name: Scribouille-${{ steps.construire.outputs.version }}
          path: |
            packaging/sortie/*.exe
            packaging/sortie/*.zip
            packaging/sortie/SHA256SUMS.txt
            notes-version.md
          retention-days: 14

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Scribouille ${{ steps.construire.outputs.version }}
          body_path: notes-version.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            packaging/sortie/Scribouille-Setup-${{ steps.construire.outputs.version }}.exe
            packaging/sortie/Scribouille-${{ steps.construire.outputs.version }}-portable.zip
            packaging/sortie/SHA256SUMS.txt
